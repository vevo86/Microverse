
name: MICROVERSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Estrai progetto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -iname 'MICROVERSE-Android-0.2.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Archivio MICROVERSE non trovato"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts non trovato nello ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          cp -a "$PROJECT_DIR"/. .
          test -d app || { echo "Cartella app non trovata"; exit 1; }

      - name: Compila MICROVERSE
        run: gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: MICROVERSE-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
