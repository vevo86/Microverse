
name: MICROVERSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Estrai progetto Android
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Archivio ZIP non trovato"
            ls -la
            exit 1
          fi

          echo "Archivio trovato: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts non trovato"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cp -a "$PROJECT_DIR"/. .
          test -d app

      - name: Compila MICROVERSE
        run: gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: MICROVERSE-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
